# Workflow security (CI that audits the CI)
#
# Purpose: the GitHub Actions workflows in this repo ARE the attack surface
# that decides whether a malicious pull request can do anything more than sit
# unreviewed. A poorly written workflow can leak the repository token, run
# attacker-supplied code from a fork's pull request, or execute a
# third-party action whose upstream tag was silently retargeted after
# review. That risk matters more here than in a typical project: this repo's
# own README instructs users to `git clone` and then run `fedora-harden.sh`
# with `sudo` on a real system, so a compromised workflow that quietly
# rewrote the script would end up executing as root on every user who pulls
# and runs it. These two tools check every workflow file in this repo for
# exactly the mistakes that would enable that:
#
#   - actionlint: catches workflow syntax errors and shell-script bugs inside
#     `run:` steps before they reach main.
#   - zizmor: a security linter for Actions. Flags template-injection holes,
#     unpinned/floating action references, credential persistence, and
#     over-broad token permissions.
#
# Add this early: it then audits every workflow added after it.

name: Workflow security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny token; each job grants only read access to the code.
permissions: {}

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned version + checksum so a tampered binary cannot run here.
      - name: Run actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" actionlint
          ./actionlint -color

  zizmor:
    name: zizmor (Actions SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned zizmor release. --offline keeps the audit hermetic (no
      # network calls about the actions it inspects); --min-severity=low
      # surfaces everything so nothing slips through under the gate.
      - name: Run zizmor
        run: |
          set -euo pipefail
          pip install zizmor==1.30.0
          zizmor --offline --min-severity=low .github/workflows/
