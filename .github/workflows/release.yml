name: Release

# Pushing a tag vX.Y.Z publishes that version: a tarball of the tagged tree, its
# SHA-256 checksum and a signed build attestation, so anyone can verify a
# download before running it as root (see "Download a release" in the README).
# The tag must match FH_VERSION in lib/01-globals.sh, and CHANGELOG.md must have a
# "## X.Y.Z" section, which becomes the release notes.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release (Fedora 45)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation (Sigstore)
      attestations: write   # store the attestation
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against FH_VERSION and the changelog
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${TAG#v}"
          declared="$(sed -n 's/^FH_VERSION="\(.*\)"$/\1/p' lib/01-globals.sh)"
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match FH_VERSION=$declared in lib/01-globals.sh"
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the tarball and checksum
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="fedora-hardening-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          sha256sum "$name.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: fedora-hardening-${{ steps.meta.outputs.version }}.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "fedora-hardening-$VERSION.tar.gz" SHA256SUMS \
            --title "fedora-hardening $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
