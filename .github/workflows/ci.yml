name: CI - Fedora Hardening Script

# Platform policy: fedora-harden.sh targets Fedora 44, so every job runs inside a
# Fedora 44 container and uses Fedora 44 RPMs for its tooling. The Ubuntu runner is
# only the container host.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly: catches breakage from new Fedora 44 package updates
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis (Fedora 44)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install Fedora 44 toolchain
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git bash findutils diffutils ShellCheck shfmt yamllint ruff hadolint python3 python3-mcp

      - uses: actions/checkout@v7

      - name: Static test tier
        run: ./tests/run-suite.sh --tier static

  secrets:
    name: Secret scan (Fedora 44 gitleaks)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install gitleaks
        run: dnf install -y --setopt=install_weak_deps=False git gitleaks

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full git history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks git --redact --no-banner --verbose .

  vulnerabilities:
    name: Vulnerability scan (Fedora 44 trivy)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Install trivy
        run: dnf install -y --setopt=install_weak_deps=False git trivy

      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        run: trivy fs --scanners vuln,misconfig,secret --format sarif --output trivy-results.sarif .

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  container-tests:
    name: Container tests (Fedora 44 images)
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    # Podman runs inside the Fedora 44 job container; the test images themselves are
    # fedora-minimal:44. --privileged is required for nested containers.
    container:
      image: registry.fedoraproject.org/fedora:44
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        tier: [quick, full]
    steps:
      - name: Install podman
        run: dnf install -y --setopt=install_weak_deps=False git podman fuse-overlayfs findutils diffutils

      - uses: actions/checkout@v7

      - name: Run ${{ matrix.tier }} tier
        run: ./tests/run-suite.sh --tier ${{ matrix.tier }} --artifacts "$RUNNER_TEMP/suite-${{ matrix.tier }}"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.tier }}
          path: ${{ runner.temp }}/suite-${{ matrix.tier }}
          if-no-files-found: ignore
