name: CI - Fedora Hardening Script

# Platform policy: every job runs inside a container of the Fedora release it tests
# and uses that release's RPMs for its tooling. Release-specific jobs run for each
# supported release (matrix "fedora"); repository-level scans run on Fedora 44.
# The Ubuntu runner is only the container host.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly: catches breakage from new Fedora 44 package updates
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny token; each job opts back in to exactly what it needs.
permissions: {}

jobs:
  static:
    name: Static analysis (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ["44", "45"]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    permissions:
      contents: read
    steps:
      - name: Install Fedora toolchain
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git bash findutils diffutils ShellCheck yamllint ruff hadolint python3 python3-mcp

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Fedora RPM where packaged (44), else the same pinned version built with Go (45+)
      - name: Install shfmt
        run: ./tests/install-shfmt.sh

      - name: Static test tier
        env:
          FEDORA: ${{ matrix.fedora }}
        run: ./tests/run-suite.sh --tier static --fedora "$FEDORA"

  secrets:
    name: Secret scan (Fedora 44 gitleaks)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    permissions:
      contents: read
    steps:
      - name: Install gitleaks
        run: dnf install -y --setopt=install_weak_deps=False git gitleaks

      # Full history: a secret committed earlier and later deleted is still in Git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full git history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks git --redact --no-banner --verbose .

  vulnerabilities:
    name: Vulnerability scan (Fedora 44 trivy)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Install trivy
        run: dnf install -y --setopt=install_weak_deps=False git trivy

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        run: trivy fs --scanners vuln,misconfig,secret --format sarif --output trivy-results.sarif .

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: trivy-results.sarif

  container-tests:
    name: Container tests (Fedora ${{ matrix.fedora }}, ${{ matrix.tier }})
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 90  # the fault tier takes about an hour
    # Podman runs nested in a job container of the release under test; the test
    # images are built on that release too. --privileged is needed for nesting.
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
      options: --privileged
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fedora: ["44", "45"]
        tier: [quick, full, gui, fault]
    steps:
      - name: Install podman
        run: dnf install -y --setopt=install_weak_deps=False git podman fuse-overlayfs findutils diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run ${{ matrix.tier }} tier
        env:
          TIER: ${{ matrix.tier }}
          FEDORA: ${{ matrix.fedora }}
          # Buildah (Fedora 45+) overlays the build context from $TMPDIR (default
          # /var/tmp, on this job container's overlay root); overlay-on-overlay
          # fails. The runner temp dir is a bind mount from the host's disk.
          TMPDIR: ${{ runner.temp }}
        run: ./tests/run-suite.sh --tier "$TIER" --fedora "$FEDORA" --artifacts "$RUNNER_TEMP/suite-$TIER"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: suite-f${{ matrix.fedora }}-${{ matrix.tier }}
          path: ${{ runner.temp }}/suite-${{ matrix.tier }}
          if-no-files-found: ignore

  # Image-based Fedora on the real images. These jobs run on the runner itself
  # (not in a job container) so they can free disk space for multi-GB images and
  # use KVM; the runner only starts containers and VMs — every check runs on the
  # Fedora Atomic image under test.
  atomic-images:
    name: Atomic images (Fedora ${{ matrix.fedora }}, ${{ matrix.variant }}, ${{ matrix.tier }})
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fedora: ["44", "45"]
        variant: [silverblue, universal-blue]
        tier: [atomic, vm]
    steps:
      - name: Free disk space for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo podman system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Allow KVM for the VM tier
        if: matrix.tier == 'vm'
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          echo "$rule" | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Fedora CoreOS builder image
        if: matrix.tier == 'vm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/fedora-harden-vm
          key: fcos-builder-${{ github.run_id }}
          restore-keys: fcos-builder-

      - name: Run ${{ matrix.tier }} tier
        env:
          TIER: ${{ matrix.tier }}
          FEDORA: ${{ matrix.fedora }}
          VARIANT: ${{ matrix.variant }}
        run: |
          # Universal Blue desktops: Bluefin is on Fedora 44, Bazzite on 45
          case "$VARIANT-$FEDORA" in
            silverblue-*) image="quay.io/fedora/fedora-silverblue:$FEDORA" ;;
            universal-blue-44) image=ghcr.io/ublue-os/bluefin:44 ;;
            universal-blue-*) image=ghcr.io/ublue-os/bazzite:stable ;;
          esac
          args=(--tier "$TIER" --fedora "$FEDORA" --image "$image" --artifacts "$RUNNER_TEMP/suite-$TIER")
          # atomic: privileged systemd containers need rootful podman on Ubuntu runners
          if [[ "$TIER" == atomic ]]; then
            sudo -E ./tests/run-suite.sh "${args[@]}"
          else
            ./tests/run-suite.sh "${args[@]}"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: suite-f${{ matrix.fedora }}-${{ matrix.variant }}-${{ matrix.tier }}
          path: ${{ runner.temp }}/suite-${{ matrix.tier }}
          if-no-files-found: ignore
