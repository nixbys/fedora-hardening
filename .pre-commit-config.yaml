# Pre-commit hooks for local validation before commits
# Install: ./setup-dev.sh   (Fedora 44 — installs the tool RPMs and the hooks)
# Run:     pre-commit run --all-files
#
# Linters are "system" hooks: they call the Fedora 44 RPMs installed by setup-dev.sh
# (ShellCheck, shfmt, yamllint, ruff, hadolint, gitleaks), so commits are checked
# with exactly the toolchain the test suite and CI use.
---
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: '3.2.0'

repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (Fedora RPM)
        entry: shellcheck --severity=warning
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt (Fedora RPM, style from .editorconfig)
        entry: shfmt -d
        language: system
        types: [shell]

      - id: yamllint
        name: yamllint (Fedora RPM)
        entry: yamllint --strict
        language: system
        types: [yaml]

      - id: ruff
        name: ruff (Fedora RPM)
        entry: ruff check --no-cache
        language: system
        types: [python]

      - id: hadolint
        name: hadolint (Fedora RPM)
        entry: hadolint
        language: system
        files: '(^|/)Dockerfile[^/]*$'

      - id: gitleaks
        name: gitleaks (Fedora RPM) - scan staged changes for secrets
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false

  # General file checks (Python hooks; run on the Fedora host's python3)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Conventional commit messages (Python hook)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
